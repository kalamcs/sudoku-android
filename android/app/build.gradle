apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def feedbackEmail = providers.environmentVariable('SUDOKU_FEEDBACK_EMAIL').getOrElse('').trim() ?: 'kalamcsdeveloper@gmail.com'
if (!(feedbackEmail ==~ /[^\s@?&#,]+@[^\s@?&#,]+\.[^\s@?&#,]+/)) {
    throw new GradleException('SUDOKU_FEEDBACK_EMAIL must contain one email address')
}

android {
    namespace = "com.kalamcs.sudoku"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kalamcs.sudoku"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'FEEDBACK_EMAIL', groovy.json.JsonOutput.toJson(feedbackEmail)
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation 'androidx.customview:customview:1.2.0'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
